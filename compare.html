<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сверка с макетом ГОСТФильм</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .comparison { position: relative; width: 812px; height: 614px; }
    .preview { width: 812px; height: 614px; border: 0; }
    .overlay { position: absolute; top: 0; left: 0; width: 811px; height: 614px; opacity: .5; pointer-events: none; }
    .settings { margin: 16px; }
  </style>
</head>
<body>
  <div class="comparison">
    <iframe class="preview" src="index.html" title="Рабочий плеер"></iframe>
    <img class="overlay" src="design/player.png" alt="Макет дизайнера" id="overlay">
  </div>
  <p class="settings">
    <label>Прозрачность макета <input id="opacity" type="range" min="0" max="100" value="50"></label>
    <span>Для сравнения остановите видео на 6-й секунде.</span>
  </p>
  <script>
    document.getElementById('opacity').addEventListener('input', function () {
      document.getElementById('overlay').style.opacity = this.value / 100;
    });
  </script>
</body>
</html>
