<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Практика Flexbox</title>
    <style>
      .flex-container { display: flex; flex-direction: column; height: 80vh; }
      .flex-content { background: #ffdc35; flex-grow: 1; }
      .flex-footer { background: #7bdfff; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <div class="flex-container">
      <div class="flex-content">Жёлтый блок занимает свободное место.</div>
      <div class="flex-footer">Голубой блок прижат к низу.</div>
    </div>
  </body>
</html>
