<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ГОСТФильм — видеоплеер</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/font-awesome/css/font-awesome.min.css">
    <style>
      .video-player {
        width: 800px;
        height: 600px;
        max-width: 100%;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      }
      .video-surface {
        width: 100%;
        height: 100%;
      }
      .control-button {
        border: none;
        background-color: transparent;
        color: white;
        cursor: pointer;
        flex: 0 0 40px;
        min-block-size: 40px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .player-controls {
        background-color: black;
      }
      .control-button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="video-player" id="player" aria-label="Видеоплеер ГОСТФильм">
      <div class="video-surface js-video-container"></div>
      <div class="player-controls">
        <button class="control-button js-play-button" type="button" aria-label="Воспроизвести"><i class="fa fa-play" aria-hidden="true"></i></button>
        <button class="control-button js-pause-button" type="button" aria-label="Пауза" hidden><i class="fa fa-pause" aria-hidden="true"></i></button>
      </div>
    </main>
    <script src="vendor/jquery.min.js"></script>
    <script src="vendor/playable.bundle.min.js"></script>
    <script src="player.js"></script>
    <script>
      createPlayer({elementId: 'player'});
    </script>
  </body>
</html>
