<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ГОСТФильм — видеоплеер</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/font-awesome/css/font-awesome.min.css">
    <style>
      .video-player {
        width: 800px;
        height: 600px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      }
      .video-surface {
        flex: 1 1 0;
        min-height: 0;
      }
      .control-button {
        border: none;
        background-color: transparent;
        color: white;
        cursor: pointer;
        font-size: 20px;
        flex: 0 0 48px;
        min-block-size: 48px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .player-controls {
        background-color: black;
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
      }
      .control-button[hidden] {
        display: none;
      }
      .controls-spacer {
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <main class="video-player" id="player" aria-label="Видеоплеер ГОСТФильм">
      <div class="video-surface js-video-container"></div>
      <div class="player-controls">
        <button class="control-button js-play-button" type="button" aria-label="Воспроизвести">
          <i class="fa fa-play" aria-hidden="true"></i>
        </button>
        <button class="control-button js-pause-button" type="button" aria-label="Пауза" hidden>
          <i class="fa fa-pause" aria-hidden="true"></i>
        </button>
        <button class="control-button js-mute-button" type="button" aria-label="Выключить звук">
          <i class="fa fa-volume-up" aria-hidden="true"></i>
        </button>
        <button class="control-button js-volume-button" type="button" aria-label="Включить звук" hidden>
          <i class="fa fa-volume-off" aria-hidden="true"></i>
        </button>
        <div class="controls-spacer"></div>
        <button class="control-button js-fullscreen-button" type="button" aria-label="На весь экран">
          <i class="fa fa-expand" aria-hidden="true"></i>
        </button>
      </div>
    </main>
    <script src="vendor/jquery.min.js"></script>
    <script src="vendor/playable.bundle.min.js"></script>
    <script src="player.js"></script>
    <script>
      createPlayer({elementId: 'player'});
    </script>
  </body>
</html>
