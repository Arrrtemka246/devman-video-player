<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ГОСТФильм — видеоплеер</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/font-awesome/css/font-awesome.min.css">
    <style>
      .video-player {
        width: 800px;
        height: 600px;
        max-width: 100%;
      }
      .video-surface {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main class="video-player" id="player" aria-label="Видеоплеер ГОСТФильм">
      <div class="video-surface js-video-container"></div>
      <div class="player-controls">
        <button class="control-button" type="button" aria-label="Воспроизвести">Play!</button>
      </div>
    </main>
    <script src="vendor/jquery.min.js"></script>
    <script src="vendor/playable.bundle.min.js"></script>
    <script src="player.js"></script>
    <script>
      createPlayer({elementId: 'player'});
    </script>
  </body>
</html>
